name: shutterlink
description: >-
  Download JPEG and CR3 photos from a Canon EOS R to your phone over the
  camera's Wi-Fi, using a pure-Dart PTP/IP client.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.13.4

workspace:
  - server

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  shared_preferences: ^2.5.6
  network_info_plus: ^8.2.2
  gal: ^2.3.3
  path_provider: ^2.1.6
  uuid: ^4.6.0
  args: ^2.7.0
  collection: ^1.19.1
  path: ^1.9.1
  crypto: ^3.0.8
  dartssh2: ^4.1.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  pretty_qr_code: ^3.6.0
  clock: ^1.1.3
  image_picker: ^1.2.4
  path_parsing: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  mime: ^2.1.0
  shelf: ^1.4.3
  shutterlink_server:
    path: server
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
