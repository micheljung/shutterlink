Categories:
  - Multimedia
  - Connectivity
License: MIT
AuthorName: Michel Jung
SourceCode: https://github.com/micheljung/shutterlink
IssueTracker: https://github.com/micheljung/shutterlink/issues

AutoName: Shutterlink

RepoType: git
Repo: https://github.com/micheljung/shutterlink.git

Builds:
  - versionName: 1.1.0
    versionCode: 2
    commit: v1.1.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.5
    prebuild:
      - sed -i -e '/signingConfig = /d' android/app/build.gradle.kts
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.1.0
CurrentVersionCode: 2
