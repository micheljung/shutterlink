Categories:
  - Connectivity
  - File Transfer
License: MIT
AuthorName: Michel Jung
SourceCode: https://github.com/micheljung/shutterlink
IssueTracker: https://github.com/micheljung/shutterlink/issues

AutoName: Shutterlink

RepoType: git
Repo: https://github.com/micheljung/shutterlink.git

Builds:
  - versionName: 1.1.0
    versionCode: 1002
    commit: 69d22ce70a87c1663eacc9487dcc7d221c76c5f2
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.47.5
    rm:
      - ios
    prebuild:
      - sed -i -e '/signingConfig = /d' android/app/build.gradle.kts
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"

