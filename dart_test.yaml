tags:
  screenshots:
    skip: Renders README screenshots; run with --tags screenshots --run-skipped.
  sftp:
    skip: Needs OpenSSH sshd; run with --tags sftp --run-skipped.
  sftp-root:
    skip: >-
      Needs sshd, sudo -n and SFTP_TEST_USER/SFTP_TEST_PASSWORD; run with
      --tags sftp-root --run-skipped.
  brand-assets:
    skip: Renders brand masters; run with --tags brand-assets --run-skipped.
  usb-hardware:
    skip: >-
      Needs libusb and a still-image camera the user may open; run with
      --tags usb-hardware --run-skipped.
