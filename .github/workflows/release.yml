name: Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.1.0
        required: true

env:
  FLUTTER_VERSION: 3.47.5
  NEXUS_URL: https://repo.micheljung.ch/repository
  RELEASE: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Name APK
        run: |
          version=$(sed -n -E 's/^version: (.+)$/\1/p' pubspec.yaml)
          if [ "$RELEASE" = true ]; then
            [ "v${version%+*}" = "$TAG" ] || { echo "Tag $TAG does not match pubspec version $version"; exit 1; }
            echo "NEXUS_REPOSITORY=$NEXUS_URL/shutterlink-release" >> "$GITHUB_ENV"
            echo "APK_NAME=shutterlink-$version.apk" >> "$GITHUB_ENV"
          else
            branch=$(echo "$TAG" | tr -c 'A-Za-z0-9._\n-' '-')
            echo "NEXUS_REPOSITORY=$NEXUS_URL/shutterlink-preview" >> "$GITHUB_ENV"
            echo "APK_NAME=shutterlink-$version-$branch-${GITHUB_SHA::7}.apk" >> "$GITHUB_ENV"
          fi
      - name: Build unsigned APK
        run: |
          sed -i -e '/signingConfig = /d' android/app/build.gradle.kts
          flutter pub get --enforce-lockfile
          flutter build apk --release
      - name: Sign APK
        env:
          KEYSTORE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.SHUTTERLINK_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SHUTTERLINK_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.SHUTTERLINK_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" sign --ks "$KEYSTORE" --ks-key-alias "${{ secrets.SHUTTERLINK_KEY_ALIAS }}" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/$APK_NAME" build/app/outputs/flutter-apk/app-release.apk
          rm "$KEYSTORE"
          "$apksigner" verify --print-certs "$RUNNER_TEMP/$APK_NAME" \
            | grep -q "certificate SHA-256 digest: ${{ vars.SHUTTERLINK_CERT_SHA256 }}"
      - name: Upload to Nexus
        run: |
          curl --fail-with-body -u "${{ vars.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
            --upload-file "$RUNNER_TEMP/$APK_NAME" \
            "$NEXUS_REPOSITORY/$APK_NAME"
