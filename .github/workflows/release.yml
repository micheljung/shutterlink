name: Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.1.0
        required: true
      dry_run:
        description: Build and sign only; skip Nexus, the GitHub release and the Play upload (Play is only validated in metadata mode)
        type: boolean
        default: true
      mode:
        description: "aab: build and publish; metadata: only validate or upload the Play store listing (no build)"
        type: choice
        options: [aab, metadata]
        default: aab
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      release_status:
        description: Play release status
        type: choice
        options: [draft, completed]
        default: draft

permissions: {}

env:
  FLUTTER_VERSION: 3.47.5
  NEXUS_URL: https://repo.micheljung.ch/repository
  RELEASE: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
  TAG: ${{ inputs.tag || github.ref_name }}
  DRY_RUN: ${{ inputs.dry_run == true }}
  MODE: ${{ inputs.mode || 'aab' }}

jobs:
  apk:
    if: inputs.mode != 'metadata'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CERT_SHA256: ${{ vars.SHUTTERLINK_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Name APK
        run: |
          version=$(sed -n -E 's/^version: (.+)$/\1/p' pubspec.yaml)
          if [ "$RELEASE" = true ]; then
            [ "v${version%+*}" = "$TAG" ] || { echo "Tag $TAG does not match pubspec version $version"; exit 1; }
            echo "NEXUS_REPOSITORY=$NEXUS_URL/shutterlink-release" >> "$GITHUB_ENV"
            echo "APK_NAME=shutterlink-$version.apk" >> "$GITHUB_ENV"
          else
            branch=$(echo "$TAG" | tr -c 'A-Za-z0-9._\n-' '-')
            echo "NEXUS_REPOSITORY=$NEXUS_URL/shutterlink-preview" >> "$GITHUB_ENV"
            echo "APK_NAME=shutterlink-$version-$branch-${GITHUB_SHA::7}.apk" >> "$GITHUB_ENV"
          fi
      - name: Build unsigned APK and AAB
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          sed -i -e '/signingConfig = /d' android/app/build.gradle.kts
          flutter pub get --enforce-lockfile
          flutter build apk --release
          if [ "$RELEASE" = true ]; then
            flutter build appbundle --release
          fi
      - name: Stop build daemons
        run: |
          (cd android && ./gradlew --stop) || true
          pkill -f 'GradleDaemon|kotlin-daemon' || true
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.SHUTTERLINK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHUTTERLINK_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SHUTTERLINK_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHUTTERLINK_KEY_ALIAS }}
        run: |
          expected=$(echo "$CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          [ -n "$expected" ] || { echo "Repository variable SHUTTERLINK_CERT_SHA256 is not set"; exit 1; }
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ks"
          keytool -list -v -keystore "$ks" -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD \
            | grep -Eq 'Subject Public Key Algorithm: (2048|[3-9][0-9]{3}|[1-9][0-9]{4,})-bit RSA key' \
            || { echo "Signing key must be RSA with at least 2048 bits (Play upload key requirement)"; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/$APK_NAME" build/app/outputs/flutter-apk/app-release.apk
          "$apksigner" verify --print-certs "$RUNNER_TEMP/$APK_NAME" \
            | sed -n -E 's/^Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)$/\1/p' \
            | tr 'A-F' 'a-f' | grep -qx "$expected" \
            || { echo "APK signer does not match SHUTTERLINK_CERT_SHA256"; exit 1; }
          if [ "$RELEASE" = true ]; then
            version=$(sed -n -E 's/^version: (.+)$/\1/p' pubspec.yaml)
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$ks" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD \
              -signedjar "$RUNNER_TEMP/shutterlink-$version.aab" \
              build/app/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
            actual=$(keytool -printcert -jarfile "$RUNNER_TEMP/shutterlink-$version.aab" \
              | sed -n -E 's/^[[:space:]]*SHA256: (.+)$/\1/p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
            echo "AAB certificate SHA-256: $actual"
            [ "$actual" = "$expected" ] || { echo "AAB signer does not match SHUTTERLINK_CERT_SHA256"; exit 1; }
            echo "AAB_PATH=$RUNNER_TEMP/shutterlink-$version.aab" >> "$GITHUB_ENV"
          fi
      - name: Upload AAB artifact
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aab
          path: ${{ env.AAB_PATH }}
          retention-days: 30
          if-no-files-found: error
      - name: Upload to Nexus
        if: env.DRY_RUN != 'true'
        env:
          NEXUS_USERNAME: ${{ vars.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          credentials=$(printf '%s:%s' "$NEXUS_USERNAME" "$NEXUS_PASSWORD" | sed -e 's/[\\"]/\\&/g')
          printf 'user = "%s"\n' "$credentials" | curl --fail-with-body -K - \
            --upload-file "$RUNNER_TEMP/$APK_NAME" \
            "$NEXUS_REPOSITORY/$APK_NAME"
      - name: Publish GitHub release
        if: env.RELEASE == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n -E 's/^version: (.+)$/\1/p' pubspec.yaml)
          changelog="fastlane/metadata/android/en-US/changelogs/${version#*+}.txt"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$APK_NAME" --clobber
          elif [ -f "$changelog" ]; then
            gh release create "$TAG" "$RUNNER_TEMP/$APK_NAME" --verify-tag \
              --title "Shutterlink ${version%+*}" --notes-file "$changelog"
          else
            gh release create "$TAG" "$RUNNER_TEMP/$APK_NAME" --verify-tag \
              --title "Shutterlink ${version%+*}" --generate-notes
          fi

  play:
    needs: apk
    if: >-
      always() && needs.apk.result != 'failure' && needs.apk.result != 'cancelled'
      && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
      && vars.PLAY_ENABLED == 'true'
      && (inputs.mode == 'metadata' || inputs.dry_run != true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Download AAB
        if: env.MODE == 'aab'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aab
          path: aab
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: '3.3'
      - name: Install fastlane
        run: gem install fastlane -v 2.228.0 --no-document
      - name: Upload to Google Play
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track || 'internal' }}
          STATUS: ${{ inputs.release_status || vars.PLAY_RELEASE_STATUS || 'draft' }}
        run: |
          args=(--package_name ch.micheljung.shutterlink
            --metadata_path fastlane/metadata/android --track "$TRACK" --release_status "$STATUS")
          if [ "$MODE" = metadata ]; then
            args+=(--skip_upload_aab --skip_upload_apk --skip_upload_changelogs)
          else
            args+=(--aab "$(ls aab/*.aab)" --skip_upload_metadata --skip_upload_images --skip_upload_screenshots)
          fi
          [ "$DRY_RUN" = true ] && args+=(--validate_only true)
          fastlane supply "${args[@]}"
