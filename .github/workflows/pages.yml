name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - PRIVACY.md
      - docs/media/**
      - docs/screenshots/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc
      - name: Build site
        run: |
          mkdir -p _site/privacy
          cp -r site/. _site/
          cp -r docs/screenshots _site/screenshots
          if [ -d docs/media ]; then cp -r docs/media _site/media; fi
          pandoc -s --metadata title="Shutterlink privacy policy" \
            --metadata lang=en PRIVACY.md -o _site/privacy/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
