name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: 3.47.5
  PTPIP_MIN_COVERAGE: 90

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Check lib/ptpip coverage
        run: |
          awk -F: -v min="$PTPIP_MIN_COVERAGE" '
            /^SF:/ { ptpip = ($2 ~ /^lib\/ptpip\//) }
            ptpip && /^LF:/ { found += $2 }
            ptpip && /^LH:/ { hit += $2 }
            END {
              if (found == 0) { print "No lib/ptpip coverage data"; exit 1 }
              pct = 100 * hit / found
              printf "lib/ptpip line coverage: %.1f%% (%d/%d)\n", pct, hit, found
              if (pct < min) { printf "Below %d%%\n", min; exit 1 }
            }' coverage/lcov.info

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
