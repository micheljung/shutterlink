name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: 3.47.5
  PTPIP_MIN_COVERAGE: 90
  UPLOAD_MIN_COVERAGE: 90

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Check lib/ptpip coverage
        run: tool/check_coverage.sh ptpip "$PTPIP_MIN_COVERAGE" coverage/lcov.info
      - name: Install OpenSSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
      - name: Create SFTP test user
        run: |
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          sudo useradd -m sftptest
          echo "sftptest:$password" | sudo chpasswd
          echo "SFTP_TEST_USER=sftptest" >> "$GITHUB_ENV"
          echo "SFTP_TEST_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Run SFTP tests
        run: |
          set -o pipefail
          flutter test --coverage --coverage-path coverage/sftp.lcov.info \
            --tags "sftp || sftp-root" --run-skipped --reporter expanded | tee sftp.log
      - name: Check SFTP tests ran
        run: |
          grep -E '\+[1-9][0-9]*: All tests passed' sftp.log && ! grep -qE '~[1-9]' sftp.log
      - name: Check lib/upload coverage
        run: tool/check_coverage.sh upload "$UPLOAD_MIN_COVERAGE" coverage/lcov.info coverage/sftp.lcov.info

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --no-codesign --debug
