name: Docker

# Builds the Sessions server image, smoke-tests it on amd64 and arm64, and
# pushes it to GHCR from main and v* tags. Pull requests only build and test.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/micheljung/shutterlink-server

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches both versions
        if: github.ref_type == 'tag'
        run: |
          app=$(sed -n -E 's/^version: ([^+]+).*/\1/p' pubspec.yaml)
          srv=$(sed -n -E 's/^version: (.+)$/\1/p' server/pubspec.yaml)
          if [ "v$app" != "$GITHUB_REF_NAME" ] || [ "v$srv" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec.yaml ($app) and server/pubspec.yaml ($srv)"
            exit 1
          fi
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # v1.2.0 -> 1.2.0, 1.2 and latest; main -> main and sha-<commit>.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Shutterlink Sessions server
            org.opencontainers.image.description=Self-hostable gallery server for Shutterlink Sessions
          annotations: |
            org.opencontainers.image.title=Shutterlink Sessions server
            org.opencontainers.image.description=Self-hostable gallery server for Shutterlink Sessions
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      # A multi-platform image cannot be loaded into the local daemon, so each
      # platform is built and tested on its own. The push below reuses the
      # cached layers.
      - name: Build amd64 for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: shutterlink-server:test-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test amd64
        run: server/docker/smoke.sh shutterlink-server:test-amd64
      - name: Build arm64 for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/arm64
          load: true
          tags: shutterlink-server:test-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test arm64 under QEMU
        run: server/docker/smoke.sh shutterlink-server:test-arm64
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && steps.meta.outputs.tags != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request' && steps.meta.outputs.tags != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
